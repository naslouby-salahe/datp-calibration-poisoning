name: CodeScene Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  codescene:
    name: CodeScene delta analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install CodeScene CLI
        run: curl -fsSL https://downloads.codescene.io/enterprise/cli/install-cs-tool.sh | sh

      - name: Delta analysis (push)
        if: github.event_name == 'push'
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            cs delta HEAD~1 HEAD
          else
            cs delta "$BEFORE" "$AFTER"
          fi

      - name: Delta analysis (pull_request)
        if: github.event_name == 'pull_request'
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        run: cs delta origin/${{ github.base_ref }} HEAD
