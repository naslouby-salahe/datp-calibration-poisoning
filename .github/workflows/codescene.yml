name: CodeScene Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  codescene:
    name: CodeScene delta analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install CodeScene CLI
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://downloads.codescene.io/enterprise/cli/cs-linux-amd64-latest.zip \
            -o /tmp/cs.zip
          unzip -q /tmp/cs.zip -d /tmp/cs-cli
          EXPECTED=$(awk '{print $1}' /tmp/cs-cli/cs.sha256)
          ACTUAL=$(sha256sum /tmp/cs-cli/cs | awk '{print $1}')
          [ "$EXPECTED" = "$ACTUAL" ] || { echo "SHA256 mismatch"; exit 1; }
          mkdir -p "$HOME/.local/bin"
          mv /tmp/cs-cli/cs "$HOME/.local/bin/cs"
          chmod +x "$HOME/.local/bin/cs"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Delta analysis (push)
        if: github.event_name == 'push'
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            cs delta HEAD~1 HEAD
          else
            cs delta "$BEFORE" "$AFTER"
          fi

      - name: Delta analysis (pull_request)
        if: github.event_name == 'pull_request'
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        run: cs delta origin/${{ github.base_ref }} HEAD
